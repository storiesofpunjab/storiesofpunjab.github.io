<!--
=====================================================================
  HOW THIS WEBSITE WORKS — READ ME FIRST
=====================================================================
  This is ONE file. Everything — structure, style, and content — lives
  in here on purpose, so you can open it by double-clicking and it
  just works, with nothing to install and nothing to break.

  Jump to the big block starting with "const SITE = {" below.
  That's the only part you should normally need to edit.

  --- Colour schemes ---
  Look for "THEMES" inside SITE. There are 5 schemes, each with a
  handful of named hex colours. Edit the hex codes to whatever you
  like, or leave the 5 slots as they are and just change the colours
  inside them. Visitors switch between them from the menu (tap the
  three lines, top right).

  --- The menu ---
  Tap the three lines in the top right to open a panel with the full
  site map (every area and every page) plus the colour scheme picker.
  You don't need to edit this — it builds itself from SITE.

  --- Contact section ---
  Edit SITE.contact.email and SITE.contact.note. It appears in the
  footer on every page.

  --- Adding / changing text ---
  Edit the text between the quotes, e.g. title: "Area One" becomes
  title: "Photography".

  --- Adding / changing pictures ---
  a) Use a picture that's already online: image: "https://example.com/photo.jpg"
  b) Use your own file: put it in a folder called "images" next to
     this file, then set image: "images/yourfile.jpg"
  Leave image: "" if you don't have one yet — a placeholder shows instead.

  --- Book covers (the 10 pages inside each area) ---
  Each page has:
    label:      a small book-name / series text that sits above the
                picture on the cover, e.g. "Book Name 1" — change it
                to whatever you like, or delete the text to hide it.
    coverColor: the colour of the book cover — any hex code.
    image:      a small picture placed on the cover, below the label.
    title:      the main title, shown at the bottom of the cover.
  The text colour on the cover switches automatically between light
  and dark so everything stays readable against your chosen colour.

  --- Adding / removing a page or a whole area ---
  Copy one block, paste it, edit it. Delete a block to remove it.
=====================================================================
-->

<style>
/* =====================================================================
   STYLE — colours are injected as CSS variables by the theme picker
   at the bottom of this file (see applyTheme). These are just the
   fallback / first-load values.
   ===================================================================== */
:root{
  --paper:      #FAF8F3;
  --paper-dim:  #F1EEE6;
  --ink:        #1C2321;
  --ink-soft:   #55605C;
  --line:       #D8D2C4;
  --accent:     #2F6F62;
  --accent-ink: #FAF8F3;
  --gold:       #B8863B;

  --serif: "Fraunces", Georgia, serif;
  --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --max-width: 960px;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }

body{
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s ease, color 0.2s ease;
}

a{ color: inherit; text-decoration: none; }
img{ max-width: 100%; display: block; }

:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap{ max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

/* -- top bar ---------------------------------------------------------- */
.topbar{
  border-bottom: 1px solid var(--line);
  padding: 18px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 20;
}
.topbar .wrap{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand-group{ display:flex; align-items:baseline; gap:14px; min-width:0; }
.brand{
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.2rem;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.crumbs{
  font-size: 0.82rem;
  color: var(--ink-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.crumbs a:hover{ color: var(--accent); }
.crumbs .sep{ margin: 0 6px; color: var(--line); }

/* -- hamburger button --------------------------------------------------- */
.menu-btn{
  flex-shrink: 0;
  width: 40px; height: 40px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 5px;
  background: none; border: 1px solid var(--line); cursor: pointer;
}
.menu-btn span{
  display: block; width: 20px; height: 2px; background: var(--ink);
}
.menu-btn:hover{ border-color: var(--accent); }

/* -- side menu ----------------------------------------------------------- */
.menu-overlay{
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 30;
}
.menu-overlay.open{ opacity: 1; pointer-events: auto; }

.menu-panel{
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(340px, 88vw);
  background: var(--paper);
  border-left: 1px solid var(--line);
  transform: translateX(100%);
  transition: transform 0.25s ease;
  z-index: 31;
  overflow-y: auto;
  padding: 20px;
}
.menu-panel.open{ transform: translateX(0); }

.menu-panel .menu-head{
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.menu-panel h2{
  font-family: var(--serif); font-size: 1.05rem; margin: 0;
}
.menu-close{
  background: none; border: none; font-size: 1.3rem; line-height: 1;
  cursor: pointer; color: var(--ink); padding: 4px;
}

.menu-section-title{
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-soft); margin: 22px 0 8px;
}
.menu-section-title:first-of-type{ margin-top: 0; }

.menu-panel details{ border-bottom: 1px solid var(--line); }
.menu-panel summary{
  padding: 10px 0; cursor: pointer; font-family: var(--serif);
  font-weight: 600; list-style: none; display:flex; justify-content:space-between; align-items:center;
}
.menu-panel summary::-webkit-details-marker{ display:none; }
.menu-panel summary::after{ content: "+"; color: var(--accent); font-family: var(--sans); }
.menu-panel details[open] summary::after{ content: "–"; }
.menu-panel .sub-links{ padding: 0 0 12px 4px; display:flex; flex-direction:column; gap:6px; }
.menu-panel .sub-links a{ font-size: 0.9rem; color: var(--ink-soft); }
.menu-panel .sub-links a:hover{ color: var(--accent); }
.menu-panel > a.home-link{
  display:block; padding: 10px 0; font-family: var(--serif); font-weight:600;
  border-bottom: 1px solid var(--line);
}

.theme-swatches{ display:flex; gap:10px; flex-wrap:wrap; }
.swatch{
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  display:flex; align-items:center; justify-content:center;
}
.swatch.active{ border-color: var(--ink); }
.swatch-name{ font-size: 0.7rem; text-align:center; margin-top:4px; color: var(--ink-soft); }
.swatch-item{ display:flex; flex-direction:column; align-items:center; width: 60px; }

/* -- hero / page headers ------------------------------------------------ */
.hero{ padding: 56px 0 36px; border-bottom: 1px solid var(--line); }
.hero .kicker{ font-size: 0.85rem; color: var(--accent); margin: 0 0 10px; }
.hero h1{
  font-family: var(--serif); font-weight: 600;
  font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.08;
  margin: 0 0 14px; max-width: 16ch;
}
.hero p{ font-size: 1rem; color: var(--ink-soft); max-width: 60ch; margin: 0; }

/* -- homepage area grid (kept smaller, per request) --------------------- */
.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin: 32px 0 56px;
}
.card{
  background: var(--paper);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: background 0.15s ease;
}
.card:hover{ background: var(--paper-dim); }
.card .num{ font-family: var(--serif); font-size: 0.85rem; color: var(--gold); }
.card .thumb{
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  background: var(--paper-dim); border: 1px solid var(--line);
}
.card .thumb.placeholder{
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-soft); font-size: 0.75rem;
}
.card h3{ font-family: var(--serif); font-weight: 600; font-size: 1rem; margin: 0; }
.card p{ color: var(--ink-soft); font-size: 0.85rem; margin: 0; flex: 1; }
.card .go{ font-size: 0.8rem; color: var(--accent); font-weight: 500; }

/* -- book-cover grid (the 10 pages inside an area) ----------------------- */
.book-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 22px;
  margin: 36px 0 60px;
}
.book{
  position: relative;
  aspect-ratio: 2 / 3;
  border: 1px solid var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  text-align: center;
  padding: 12px 10px 14px;
  overflow: hidden;
}
/* spine shadow line, like a closed hardcover */
.book::before{
  content: "";
  position: absolute; left: 10px; top: 0; bottom: 0; width: 1px;
  background: rgba(0,0,0,0.18);
}
.book::after{
  content: "";
  position: absolute; inset: 5px;
  border: 1px solid rgba(255,255,255,0.25);
  pointer-events: none;
}
.book .book-num{
  position: absolute; top: 10px; right: 12px;
  font-family: var(--serif); font-size: 0.75rem; opacity: 0.75;
}
.book .book-label{
  font-family: var(--sans);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  opacity: 0.85;
  margin-bottom: 10px;
}
.book .book-cover-img{
  width: 56%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border: 1px solid rgba(0,0,0,0.2);
  margin-bottom: 12px;
  background: rgba(255,255,255,0.15);
}
.book .book-cover-img.placeholder{
  display:flex; align-items:center; justify-content:center;
  font-size: 0.65rem;
}
.book h3{
  font-family: var(--serif); font-weight: 600;
  font-size: 0.92rem; line-height: 1.2; margin: 0;
}
.book:hover{ filter: brightness(1.04); }

/* -- single content page (a "page" inside an area) --------------------- */
.article{ padding: 44px 0 72px; }
.article .thumb-large{
  width: 100%; max-height: 400px; object-fit: cover;
  border: 1px solid var(--line); margin-bottom: 30px; background: var(--paper-dim);
}
.article .thumb-large.placeholder{
  aspect-ratio: 16/7; display:flex; align-items:center; justify-content:center; color: var(--ink-soft);
}
.article .body{ font-size: 1.02rem; max-width: 68ch; white-space: pre-line; }

/* -- footer / contact ---------------------------------------------------- */
footer{ border-top: 1px solid var(--line); }
.footer-contact{
  padding: 40px 0;
  border-bottom: 1px solid var(--line);
}
.footer-contact h2{
  font-family: var(--serif); font-weight: 600;
  font-size: 1.4rem; margin: 0 0 10px;
}
.footer-contact p{ color: var(--ink-soft); max-width: 52ch; margin: 0 0 16px; }
.footer-contact .email-link{
  display: inline-block;
  font-family: var(--serif); font-size: 1.1rem; color: var(--accent);
  border-bottom: 1px solid var(--accent); padding-bottom: 2px;
}
.footer-bottom{
  padding: 18px 0; color: var(--ink-soft); font-size: 0.82rem;
}

@media (max-width: 560px){
  .hero{ padding: 40px 0 24px; }
  .grid{ margin: 24px 0 44px; grid-template-columns: 1fr; }
  .book-grid{ grid-template-columns: 1fr; gap: 16px; }
  .book{
    aspect-ratio: auto;
    display: grid;
    grid-template-columns: 84px 1fr;
    grid-template-areas: "img label" "img title";
    align-items: center;
    column-gap: 16px;
    row-gap: 4px;
    padding: 14px 16px;
  }
  .book .book-cover-img{ grid-area: img; width: 84px; height: 84px; margin-bottom: 0; }
  .book .book-label{ grid-area: label; text-align: left; align-self: end; }
  .book h3{ grid-area: title; text-align: left; align-self: start; margin-top: 0; }
  .book .book-num{ top: 10px; right: 12px; }
}
</style>
</head>

   ===================================================================== */
document.title = SITE.siteName;
document.getElementById("brandLink").textContent = SITE.siteName;
document.getElementById("footerText").textContent = "© " + SITE.siteName;
document.getElementById("contactNote").textContent = SITE.contact.note;
document.getElementById("contactEmail").textContent = SITE.contact.email;
document.getElementById("contactEmail").href = "mailto:" + SITE.contact.email;

const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : str;
  return d.innerHTML;
}

function thumb(image, alt, cls){
  if(image){
    const img = document.createElement("img");
    img.src = image; img.alt = alt; img.className = cls;
    return img;
  }
  const div = document.createElement("div");
  div.className = cls + " placeholder";
  div.textContent = "No image yet";
  return div;
}

/* picks readable text colour (near-black or near-white) for a given hex background */
function contrastText(hex){
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.55 ? "#1C1C1C" : "#FAF8F3";
}

function card(numLabel, title, blurb, image, href){
  const a = document.createElement("a");
  a.className = "card";
  a.href = href;

  const num = document.createElement("div");
  num.className = "num";
  num.textContent = numLabel;
  a.appendChild(num);

  a.appendChild(thumb(image, title, "thumb"));

  const h3 = document.createElement("h3");
  h3.textContent = title;
  a.appendChild(h3);

  if(blurb){
    const p = document.createElement("p");
    p.textContent = blurb;
    a.appendChild(p);
  }

  const go = document.createElement("div");
  go.className = "go";
  go.textContent = "Open";
  a.appendChild(go);

  return a;
}

function bookCard(numLabel, title, label, coverColor, image, href){
  const a = document.createElement("a");
  a.className = "book";
  const bg = coverColor || "var(--paper-dim)";
  a.style.background = bg;
  a.style.color = coverColor ? contrastText(coverColor) : "var(--ink)";
  a.href = href;

  const num = document.createElement("div");
  num.className = "book-num";
  num.textContent = numLabel;
  a.appendChild(num);

  if(label){
    const labelEl = document.createElement("div");
    labelEl.className = "book-label";
    labelEl.textContent = label;
    a.appendChild(labelEl);
  }

  a.appendChild(thumb(image, title, "book-cover-img"));

  const h3 = document.createElement("h3");
  h3.textContent = title;
  a.appendChild(h3);

  return a;
}

function setCrumbs(parts){
  crumbs.innerHTML = "";
  parts.forEach((p, i) => {
    if(i > 0){
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "/";
      crumbs.appendChild(sep);
    }
    if(p.href){
      const a = document.createElement("a");
      a.href = p.href; a.textContent = p.label;
      crumbs.appendChild(a);
    } else {
      const span = document.createElement("span");
      span.textContent = p.label;
      crumbs.appendChild(span);
    }
  });
}

function renderHome(){
  setCrumbs([{ label: "Home" }]);
  app.innerHTML = "";

  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="wrap">
      <p class="kicker">${escapeHtml(SITE.tagline)}</p>
      <h1>${escapeHtml(SITE.siteName)}</h1>
      <p>${escapeHtml(SITE.intro)}</p>
    </div>`;
  app.appendChild(hero);

  const gridWrap = document.createElement("div");
  gridWrap.className = "wrap";
  const grid = document.createElement("div");
  grid.className = "grid";

  SITE.areas.forEach((area, i) => {
    grid.appendChild(card(
      String(i + 1).padStart(2, "0"),
      area.title, area.blurb, area.image,
      `#/area/${i}`
    ));
  });

  gridWrap.appendChild(grid);
  app.appendChild(gridWrap);
}

function renderArea(areaIndex){
  const area = SITE.areas[areaIndex];
  if(!area) return renderNotFound();

  setCrumbs([{ label: "Home", href: "#/" }, { label: area.title }]);
  app.innerHTML = "";

  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="wrap">
      <p class="kicker">Area ${areaIndex + 1} of ${SITE.areas.length}</p>
      <h1>${escapeHtml(area.title)}</h1>
      <p>${escapeHtml(area.blurb || "")}</p>
    </div>`;
  app.appendChild(hero);

  const gridWrap = document.createElement("div");
  gridWrap.className = "wrap";
  const grid = document.createElement("div");
  grid.className = "book-grid";

  area.pages.forEach((page, i) => {
    grid.appendChild(bookCard(
      String(i + 1).padStart(2, "0"),
      page.title, page.label, page.coverColor, page.image,
      `#/area/${areaIndex}/page/${i}`
    ));
  });

  gridWrap.appendChild(grid);
  app.appendChild(gridWrap);
}

function renderPage(areaIndex, pageIndex){
  const area = SITE.areas[areaIndex];
  const page = area && area.pages[pageIndex];
  if(!area || !page) return renderNotFound();

  setCrumbs([
    { label: "Home", href: "#/" },
    { label: area.title, href: `#/area/${areaIndex}` },
    { label: page.title }
  ]);
  app.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.className = "wrap article";

  const kicker = document.createElement("p");
  kicker.className = "kicker";
  kicker.style.margin = "0 0 8px";
  kicker.textContent = `${area.title} — page ${pageIndex + 1} of ${area.pages.length}`;
  wrap.appendChild(kicker);

  const h1 = document.createElement("h1");
  h1.style.fontFamily = "var(--serif)";
  h1.style.fontSize = "clamp(1.7rem, 4vw, 2.4rem)";
  h1.style.margin = "0 0 28px";
  h1.textContent = page.title;
  wrap.appendChild(h1);

  wrap.appendChild(thumb(page.image, page.title, "thumb-large"));

  const body = document.createElement("div");
  body.className = "body";
  body.textContent = page.text || "";
  wrap.appendChild(body);

  app.appendChild(wrap);
}

function renderNotFound(){
  setCrumbs([{ label: "Home", href: "#/" }, { label: "Not found" }]);
  app.innerHTML = `<div class="wrap hero"><h1>Page not found</h1><p>That link doesn't match anything in SITE. <a href="#/">Go home</a>.</p></div>`;
}

function route(){
  const hash = location.hash || "#/";
  const parts = hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if(parts.length === 0){
    renderHome();
  } else if(parts[0] === "area" && parts.length === 2){
    renderArea(Number(parts[1]));
  } else if(parts[0] === "area" && parts.length === 4 && parts[2] === "page"){
    renderPage(Number(parts[1]), Number(parts[3]));
  } else {
    renderNotFound();
  }
  window.scrollTo(0, 0);
  closeMenu();
}

/* -- menu: builds the full site map + theme swatches --------------------- */
const menuAreas = document.getElementById("menuAreas");
const menuBtn = document.getElementById("menuBtn");
const menuClose = document.getElementById("menuClose");
const menuOverlay = document.getElementById("menuOverlay");
const menuPanel = document.getElementById("menuPanel");

function buildMenu(){
  menuAreas.innerHTML = "";
  SITE.areas.forEach((area, i) => {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = area.title;
    details.appendChild(summary);

    const subLinks = document.createElement("div");
    subLinks.className = "sub-links";

    const areaLink = document.createElement("a");
    areaLink.href = `#/area/${i}`;
    areaLink.textContent = "Area overview";
    areaLink.style.fontWeight = "600";
    subLinks.appendChild(areaLink);

    area.pages.forEach((page, j) => {
      const a = document.createElement("a");
      a.href = `#/area/${i}/page/${j}`;
      a.textContent = page.title;
      subLinks.appendChild(a);
    });

    details.appendChild(subLinks);
    menuAreas.appendChild(details);
  });
}

function openMenu(){
  menuOverlay.classList.add("open");
  menuPanel.classList.add("open");
  menuBtn.setAttribute("aria-expanded", "true");
}
function closeMenu(){
  menuOverlay.classList.remove("open");
  menuPanel.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
}
menuBtn.addEventListener("click", openMenu);
menuClose.addEventListener("click", closeMenu);
menuOverlay.addEventListener("click", closeMenu);

/* -- theme switching ------------------------------------------------------ */
const themeSwatches = document.getElementById("themeSwatches");

function applyTheme(index){
  const t = SITE.themes[index];
  if(!t) return;
  const root = document.documentElement.style;
  root.setProperty("--paper", t.paper);
  root.setProperty("--paper-dim", t.paperDim);
  root.setProperty("--ink", t.ink);
  root.setProperty("--ink-soft", t.inkSoft);
  root.setProperty("--line", t.line);
  root.setProperty("--accent", t.accent);
  root.setProperty("--accent-ink", t.accentInk);
  root.setProperty("--gold", t.gold);

  document.querySelectorAll(".swatch").forEach((el, i) => {
    el.classList.toggle("active", i === index);
  });

  try{ localStorage.setItem("site-theme-index", String(index)); }catch(e){}
}

function buildSwatches(){
  themeSwatches.innerHTML = "";
  SITE.themes.forEach((t, i) => {
    const item = document.createElement("div");
    item.className = "swatch-item";

    const btn = document.createElement("button");
    btn.className = "swatch";
    btn.style.background = t.accent;
    btn.setAttribute("aria-label", "Use " + t.name + " colour scheme");
    btn.addEventListener("click", () => applyTheme(i));

    const label = document.createElement("div");
    label.className = "swatch-name";
    label.textContent = t.name;

    item.appendChild(btn);
    item.appendChild(label);
    themeSwatches.appendChild(item);
  });
}

/* -- boot ------------------------------------------------------------------ */
buildMenu();
buildSwatches();

let startIndex = 0;
try{
  const saved = localStorage.getItem("site-theme-index");
  if(saved !== null && SITE.themes[Number(saved)]) startIndex = Number(saved);
}catch(e){}
applyTheme(startIndex);

window.addEventListener("hashchange", route);
route();
</script>
</body>
