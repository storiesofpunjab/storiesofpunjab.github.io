<!--
=====================================================================
  HOW THIS WEBSITE WORKS — READ ME FIRST
=====================================================================
  This is ONE file. Everything — structure, style, and content — lives
  in here on purpose, so you can open it by double-clicking and it
  just works, with nothing to install and nothing to break.

  There are three parts, top to bottom:
    1. STYLE   — look and feel (colors, fonts, spacing)
    2. CONTENT — your homepage, 5 areas, and 10 pages inside each area
    3. ENGINE  — the code that turns CONTENT into pages (don't touch)

  YOU WILL ALMOST ALWAYS ONLY EDIT PART 2, "CONTENT".
  Look for the big block starting with "const SITE = {" below.

  --- Adding / changing text ---
  Just edit the text between the quotes, e.g.
    title: "Photography"
  becomes
    title: "My Trip Photos"

  --- Adding / changing pictures ---
  Two easy options:
    a) Use a picture that's already online: set image to its address, e.g.
         image: "https://example.com/some-photo.jpg"
    b) Use your own picture file:
         1. Create a folder called "images" next to this file
         2. Put your picture in it, e.g. images/beach.jpg
         3. Set image: "images/beach.jpg"
  Leave image: "" (empty quotes) if you don't have one yet — a neat
  placeholder will show automatically instead.

  --- Adding / removing a page inside an area ---
  Copy one of the { title: ..., image: ..., text: ... } blocks inside
  a "pages: [ ... ]" list, paste it, and edit it. Delete a block to
  remove that page. Each area supports as many pages as you like —
  it's set up for 10, but you can add more or fewer.

  --- Adding / removing a whole area ---
  Same idea, one level up: copy/paste/edit or delete a whole
  { title: ..., blurb: ..., image: ..., pages: [...] } block inside
  "areas: [ ... ]".

  --- Changing the site name / homepage intro ---
  Edit siteName, tagline, and intro near the top of SITE.

  --- Changing colors / fonts ---
  Scroll to the STYLE section and edit the values inside :root { }.
  Everything on the site references those few variables.
=====================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1. STYLE — edit these variables to reskin the whole site
   ===================================================================== */
:root{
  --paper:      #FAF8F3;   /* page background */
  --paper-dim:  #F1EEE6;   /* card background */
  --ink:        #1C2321;   /* main text */
  --ink-soft:   #55605C;   /* secondary text */
  --line:       #D8D2C4;   /* hairline borders */
  --accent:     #2F6F62;   /* primary accent (numbers, links, focus) */
  --accent-ink: #FAF8F3;   /* text that sits on top of accent */
  --gold:       #B8863B;   /* secondary accent, used sparingly */

  --serif: "Fraunces", Georgia, serif;
  --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --max-width: 960px;
}

*{ box-sizing: border-box; }

html{ scroll-behavior: smooth; }

body{
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a{ color: inherit; text-decoration: none; }

img{ max-width: 100%; display: block; }

:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.wrap{
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

/* -- top bar ---------------------------------------------------------- */
.topbar{
  border-bottom: 1px solid var(--line);
  padding: 20px 0;
}
.topbar .wrap{
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.brand{
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: -0.01em;
}
.crumbs{
  font-size: 0.85rem;
  color: var(--ink-soft);
}
.crumbs a:hover{ color: var(--accent); }
.crumbs .sep{ margin: 0 6px; color: var(--line); }

/* -- hero / page headers ------------------------------------------------ */
.hero{
  padding: 64px 0 40px;
  border-bottom: 1px solid var(--line);
}
.hero .kicker{
  font-size: 0.85rem;
  color: var(--accent);
  margin: 0 0 10px;
}
.hero h1{
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height: 1.08;
  margin: 0 0 16px;
  max-width: 16ch;
}
.hero p{
  font-size: 1.05rem;
  color: var(--ink-soft);
  max-width: 60ch;
  margin: 0;
}

/* -- grid of cards (used for both the 5 areas and the 10 pages) -------- */
.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin: 40px 0 64px;
}
.card{
  background: var(--paper);
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: background 0.15s ease;
}
.card:hover{ background: var(--paper-dim); }

.card .num{
  font-family: var(--serif);
  font-size: 0.95rem;
  color: var(--gold);
}
.card .thumb{
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: var(--paper-dim);
  border: 1px solid var(--line);
}
.card .thumb.placeholder{
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
  font-size: 0.8rem;
}
.card h3{
  font-family: var(--serif);
  font-weight: 600;
  font-size: 1.15rem;
  margin: 0;
}
.card p{
  color: var(--ink-soft);
  font-size: 0.92rem;
  margin: 0;
  flex: 1;
}
.card .go{
  font-size: 0.85rem;
  color: var(--accent);
  font-weight: 500;
}

/* -- single content page (a "page" inside an area) --------------------- */
.article{
  padding: 48px 0 80px;
}
.article .thumb-large{
  width: 100%;
  max-height: 420px;
  object-fit: cover;
  border: 1px solid var(--line);
  margin-bottom: 32px;
  background: var(--paper-dim);
}
.article .thumb-large.placeholder{
  aspect-ratio: 16 / 7;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
}
.article .body{
  font-size: 1.05rem;
  max-width: 68ch;
  white-space: pre-line; /* lets blank lines in your text become paragraph breaks */
}

/* -- footer ------------------------------------------------------------- */
footer{
  border-top: 1px solid var(--line);
  padding: 24px 0;
  color: var(--ink-soft);
  font-size: 0.85rem;
}

@media (max-width: 560px){
  .hero{ padding: 44px 0 28px; }
  .grid{ margin: 28px 0 48px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="#/" class="brand" id="brandLink">My Site</a>
    <nav class="crumbs" id="crumbs"></nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap" id="footerText">© Your Name</div>
</footer>

<script>
/* =====================================================================
   2. CONTENT — this is the part you edit day to day.
   ===================================================================== */
const SITE = {
  siteName: "My Site",              // shown top-left and as the footer name
  tagline:  "A small corner of the internet I'm building",
  intro:    "Pick an area below to explore what's inside. Each one opens up into ten pages of its own.",

  // Exactly 5 of these show on the homepage. Add or remove blocks to
  // change that number — nothing else needs to change.
  areas: [
    {

        { title: "Page 1",  image: "", text: "Write anything you like here. This text can be as long as you want." },

      ]
    },
    {

      blurb: "A short line describing what lives in this area.",
      image: "",
      pages: [
        { title: "Page 1",  image: "", text: "Edit this text for page 1." },
        { title: "Page 2",  image: "", text: "Edit this text for page 2." },
        { title: "Page 3",  image: "", text: "Edit this text for page 3." },
        { title: "Page 4",  image: "", text: "Edit this text for page 4." },
        { title: "Page 5",  image: "", text: "Edit this text for page 5." },
        { title: "Page 6",  image: "", text: "Edit this text for page 6." },
        { title: "Page 7",  image: "", text: "Edit this text for page 7." },
        { title: "Page 8",  image: "", text: "Edit this text for page 8." },
        { title: "Page 9",  image: "", text: "Edit this text for page 9." },
        { title: "Page 10", image: "", text: "Edit this text for page 10." }
      ]
    },
    {
      title: "Area Three",
      blurb: "A short line describing what lives in this area.",
      image: "",
      pages: [
        { title: "Page 1",  image: "", text: "Edit this text for page 1." },
        { title: "Page 2",  image: "", text: "Edit this text for page 2." },
        { title: "Page 3",  image: "", text: "Edit this text for page 3." },
        { title: "Page 4",  image: "", text: "Edit this text for page 4." },
        { title: "Page 5",  image: "", text: "Edit this text for page 5." },
        { title: "Page 6",  image: "", text: "Edit this text for page 6." },
        { title: "Page 7",  image: "", text: "Edit this text for page 7." },
        { title: "Page 8",  image: "", text: "Edit this text for page 8." },
        { title: "Page 9",  image: "", text: "Edit this text for page 9." },
        { title: "Page 10", image: "", text: "Edit this text for page 10." }
      ]
    },
    {
      title: "Area Four",
      blurb: "A short line describing what lives in this area.",
      image: "",
      pages: [
        { title: "Page 1",  image: "", text: "Edit this text for page 1." },
        { title: "Page 2",  image: "", text: "Edit this text for page 2." },
        { title: "Page 3",  image: "", text: "Edit this text for page 3." },
        { title: "Page 4",  image: "", text: "Edit this text for page 4." },
        { title: "Page 5",  image: "", text: "Edit this text for page 5." },
        { title: "Page 6",  image: "", text: "Edit this text for page 6." },
        { title: "Page 7",  image: "", text: "Edit this text for page 7." },

      ]
    },
    {
      title: "Area Five",

      image: "",
      pages: [
        { title: "Page 1",  image: "", text: "Edit this text for page 1." },
        { title: "Page 2",  image: "", text: "Edit this text for page 2." },
        { title: "Page 3",  image: "", text: "Edit this text for page 3." },
        { title: "Page 4",  image: "", text: "Edit this text for page 4." },
        { title: "Page 5",  image: "", text: "Edit this text for page 5." },

        { title: "Page 9",  image: "", text: "Edit this text for page 9." },
        { title: "Page 10", image: "", text: "Edit this text for page 10." }
      ]
    }
  ]
};


/* =====================================================================
   3. ENGINE — turns SITE into pages. You shouldn't need to touch this,
      but nothing bad happens if you look.
   ===================================================================== */
document.title = SITE.siteName;
document.getElementById("brandLink").textContent = SITE.siteName;
document.getElementById("footerText").textContent = "© " + SITE.siteName;

const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");

function thumb(image, alt, cls){
  if(image){
    const img = document.createElement("img");
    img.src = image; img.alt = alt; img.className = cls;
    return img;
  }
  const div = document.createElement("div");
  div.className = cls + " placeholder";
  div.textContent = "No image yet";
  return div;
}

function card(numLabel, title, blurb, image, href){
  const a = document.createElement("a");
  a.className = "card";
  a.href = href;

  const num = document.createElement("div");
  num.className = "num";
  num.textContent = numLabel;
  a.appendChild(num);

  a.appendChild(thumb(image, title, "thumb"));

  const h3 = document.createElement("h3");
  h3.textContent = title;
  a.appendChild(h3);

  if(blurb){
    const p = document.createElement("p");
    p.textContent = blurb;
    a.appendChild(p);
  }

  const go = document.createElement("div");
  go.className = "go";
  go.textContent = "Open";
  a.appendChild(go);

  return a;
}

function setCrumbs(parts){
  crumbs.innerHTML = "";
  parts.forEach((p, i) => {
    if(i > 0){
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "/";
      crumbs.appendChild(sep);
    }
    if(p.href){
      const a = document.createElement("a");
      a.href = p.href; a.textContent = p.label;
      crumbs.appendChild(a);
    } else {
      const span = document.createElement("span");
      span.textContent = p.label;
      crumbs.appendChild(span);
    }
  });
}

function renderHome(){
  setCrumbs([{ label: "Home" }]);
  app.innerHTML = "";

  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="wrap">
      <p class="kicker">${escapeHtml(SITE.tagline)}</p>
      <h1>${escapeHtml(SITE.siteName)}</h1>
      <p>${escapeHtml(SITE.intro)}</p>
    </div>`;
  app.appendChild(hero);

  const gridWrap = document.createElement("div");
  gridWrap.className = "wrap";
  const grid = document.createElement("div");
  grid.className = "grid";

  SITE.areas.forEach((area, i) => {
    grid.appendChild(card(
      String(i + 1).padStart(2, "0"),
      area.title, area.blurb, area.image,
      `#/area/${i}`
    ));
  });

  gridWrap.appendChild(grid);
  app.appendChild(gridWrap);
}

function renderArea(areaIndex){
  const area = SITE.areas[areaIndex];
  if(!area) return renderNotFound();

  setCrumbs([{ label: "Home", href: "#/" }, { label: area.title }]);
  app.innerHTML = "";

  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="wrap">
      <p class="kicker">Area ${areaIndex + 1} of ${SITE.areas.length}</p>
      <h1>${escapeHtml(area.title)}</h1>
      <p>${escapeHtml(area.blurb || "")}</p>
    </div>`;
  app.appendChild(hero);

  const gridWrap = document.createElement("div");
  gridWrap.className = "wrap";
  const grid = document.createElement("div");
  grid.className = "grid";

  area.pages.forEach((page, i) => {
    grid.appendChild(card(
      String(i + 1).padStart(2, "0"),
      page.title, "", page.image,
      `#/area/${areaIndex}/page/${i}`
    ));
  });

  gridWrap.appendChild(grid);
  app.appendChild(gridWrap);
}

function renderPage(areaIndex, pageIndex){
  const area = SITE.areas[areaIndex];
  const page = area && area.pages[pageIndex];
  if(!area || !page) return renderNotFound();

  setCrumbs([
    { label: "Home", href: "#/" },
    { label: area.title, href: `#/area/${areaIndex}` },
    { label: page.title }
  ]);
  app.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.className = "wrap article";

  const kicker = document.createElement("p");
  kicker.className = "kicker";
  kicker.style.margin = "0 0 8px";
  kicker.textContent = `${area.title} — page ${pageIndex + 1} of ${area.pages.length}`;
  wrap.appendChild(kicker);

  const h1 = document.createElement("h1");
  h1.style.fontFamily = "var(--serif)";
  h1.style.fontSize = "clamp(1.7rem, 4vw, 2.4rem)";
  h1.style.margin = "0 0 28px";
  h1.textContent = page.title;
  wrap.appendChild(h1);

  wrap.appendChild(thumb(page.image, page.title, "thumb-large"));

  const body = document.createElement("div");
  body.className = "body";
  body.textContent = page.text || "";
  wrap.appendChild(body);

  app.appendChild(wrap);
}

function renderNotFound(){
  setCrumbs([{ label: "Home", href: "#/" }, { label: "Not found" }]);
  app.innerHTML = `<div class="wrap hero"><h1>Page not found</h1><p>That link doesn't match anything in SITE. <a href="#/">Go home</a>.</p></div>`;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function route(){
  const hash = location.hash || "#/";
  const parts = hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  // [] -> home
  // ["area","0"] -> area page
  // ["area","0","page","3"] -> single page
  if(parts.length === 0){
    renderHome();
  } else if(parts[0] === "area" && parts.length === 2){
    renderArea(Number(parts[1]));
  } else if(parts[0] === "area" && parts.length === 4 && parts[2] === "page"){
    renderPage(Number(parts[1]), Number(parts[3]));
  } else {
    renderNotFound();
  }
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
